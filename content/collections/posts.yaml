title: Posts
template: posts/show
layout: layout
taxonomies:
  - yegvote_2025_update_types
  - topics
  - fringe_festival
revisions: false
route: 'posts/{slug}'
date: true
# Newest first in the CP listing — the post being worked on is nearly always the most recent
# one, and the oldest-first default meant scrolling past years of archive to reach it.
# Safe to change: every front-end listing passes its own `sort="date:desc"`.
sort_by: date
sort_dir: desc
date_behavior:
  past: public
  future: private
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
