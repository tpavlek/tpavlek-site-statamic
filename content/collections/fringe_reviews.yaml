title: 'Fringe Reviews'
template: fringe/review
layout: layout
revisions: false
route: 'fringe/{festival}/reviews/{url_slug}'
# The CP opens on this collection (see the start_page preference in users/), so the list
# defaults to newest festival first. AppServiceProvider adds last_modified desc as the
# secondary sort, since a collection can only declare one sort field.
sort_by: festival
sort_dir: desc
date: true
# Reviews are dated within the festival they cover, so a show at an upcoming festival is
# future-dated. Watchlist entries have to be readable before the festival opens, so future
# entries stay public.
date_behavior:
  past: public
  future: public
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
