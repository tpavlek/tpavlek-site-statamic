title: 'Long-form body'
fields:
  -
    handle: body
    field:
      remove_empty_nodes: false
      type: bard
      display: Content
      container: assets
      buttons:
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - quote
        - anchor
        - horizontalrule
        - image
        - table
        - code
        - bts_pins
      bts_pins:
        - review_ref
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            candidate:
              display: Candidate
              fields:
                -
                  handle: candidate
                  field:
                    max_items: 1
                    mode: typeahead
                    collections:
                      - yegvote_2025_candidates
                    type: entries
                    display: Candidate
            show:
              display: 'Show heading'
              icon: entry
              instructions: 'Starts a section about one show. Renders as a real heading, unlike the inline review pin, which is always stuck inside a paragraph.'
              fields:
                -
                  handle: review
                  field:
                    max_items: 1
                    mode: typeahead
                    collections:
                      - fringe_reviews
                    type: review_ref_entries
                    display: Show
                    instructions: 'The show this section is about. Its stars only appear if this entry has its own rating — a returning show that has not opened yet has nothing to show.'
                -
                  handle: previous_reviews
                  field:
                    mode: typeahead
                    collections:
                      - fringe_reviews
                    type: review_ref_entries
                    display: 'Previously'
                    instructions: 'Leave empty and the company''s earlier Fringe shows are listed automatically, newest first. Only fill this in to show a specific subset, or for a company that has changed names.'
                -
                  handle: level
                  field:
                    type: select
                    display: 'Heading level'
                    default: h2
                    clearable: false
                    instructions: 'h2 for a top-level section. h3 only if it sits inside one.'
                    options:
                      h2: 'Heading 2'
                      h3: 'Heading 3'
            image:
              display: image
              icon: media-image-picture-orientation
              fields:
                -
                  handle: images
                  field:
                    container: assets
                    dynamic: slug
                    type: assets
                    display: Images
                -
                  handle: alignment
                  field:
                    type: select
                    display: Placement
                    default: full
                    clearable: false
                    instructions: 'Float left or right to wrap the following paragraphs around the image. On phones a floated image goes full width, because there is no room to wrap.'
                    options:
                      full: 'Full width'
                      left: 'Float left, text wraps right'
                      right: 'Float right, text wraps left'
                -
                  handle: caption
                  field:
                    type: text
                    display: Caption
                    instructions: 'Optional. Shown under the image.'
            break:
              display: 'Break (invisible)'
              instructions: 'Ends the text wrap around a floated image without drawing anything. Use it between two facing images so the text starts beside the second one. For a visible divider, use the horizontal rule button instead.'
              fields:
                -
                  handle: space
                  field:
                    type: select
                    display: 'Extra space'
                    default: none
                    clearable: false
                    instructions: 'Vertical gap left behind, on top of the clearing.'
                    options:
                      none: None
                      small: Small
                      large: Large
            email_subscription_prompt:
              display: 'Email Subscription prompt'
              instructions: 'Include an inline email subscription prompt'
              icon: mail-sign-at
              fields:
                -
                  handle: include_content
                  field:
                    options:
                      -
                        key: immediate_list
                        value: 'Immediate List Note'
                    type: checkboxes
                    display: 'Include Content'
                    instructions: 'Sections you want to include'
            social_embed:
              display: 'Social Embed'
              instructions: 'Embed social content'
              icon: social-share
              fields:
                -
                  handle: instagram
                  field:
                    type: code
                    display: Instagram
                    instructions: 'Enter in the instagram embed code'
        story:
          display: Story
          sets:
            timestamp:
              display: Timestamp
              icon: time-clock
              instructions: 'A clock marker on the timeline down the left of the post. Put it before the paragraph that happens at that time.'
              fields:
                -
                  handle: time
                  field:
                    type: text
                    display: Time
                    instructions: 'As it should read, e.g. "11:30am" or "~4pm".'
            beat:
              display: Beat
              icon: text-formatting-initial-letter
              instructions: 'A one-line punchline that needs a pause around it.'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Line
            dialogue:
              display: Dialogue
              icon: mail-chat-bubble-text
              instructions: 'Overheard chatter as speech bubbles, a back-and-forth as a transcript, or an interview as a chatroom.'
              fields:
                -
                  handle: style
                  field:
                    type: button_group
                    display: Style
                    default: chatter
                    options:
                      chatter: 'Overheard chatter'
                      transcript: Transcript
                      chat: 'Chatroom (interview)'
                      clippings: 'Press clippings'
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    instructions: 'Optional. A small heading over the block, e.g. "Overheard in the hallway".'
                -
                  handle: lines
                  field:
                    type: grid
                    display: Lines
                    mode: stacked
                    add_row: 'Add line'
                    fields:
                      -
                        handle: speaker
                        field:
                          type: text
                          display: Speaker
                          width: 25
                          instructions: 'Transcripts and chatrooms. In a chatroom, match a name under People to show their photo; leave it empty for a system line, e.g. a long silence. In press clippings, the outlet the quote ran in.'
                      -
                        handle: line
                        field:
                          type: text
                          display: Line
                          width: 75
                      -
                        handle: aside
                        field:
                          type: text
                          display: Aside
                          instructions: 'Optional. Your commentary on the line, shown under it in smaller type.'
                      -
                        handle: escalate
                        field:
                          type: toggle
                          display: Escalate
                          instructions: 'Chatroom only. A refrain that gets louder: shown under the previous message without a photo, each escalating line in the block styled more obnoxiously than the last.'
                -
                  handle: people
                  field:
                    type: grid
                    display: People
                    mode: table
                    add_row: 'Add person'
                    instructions: 'Chatroom only. A photo for each speaker, matched by name.'
                    fields:
                      -
                        handle: name
                        field:
                          type: text
                          display: Name
                      -
                        handle: photo
                        field:
                          type: assets
                          container: assets
                          max_files: 1
                          display: Photo
            stats:
              display: 'Stat strip'
              icon: money-graph-bar-increase
              instructions: 'A row of big numbers.'
              fields:
                -
                  handle: stats
                  field:
                    type: grid
                    display: Stats
                    add_row: 'Add stat'
                    fields:
                      -
                        handle: value
                        field:
                          type: text
                          display: Number
                      -
                        handle: label
                        field:
                          type: text
                          display: Label
            explainer:
              display: Explainer
              icon: dictionary-language-book
              instructions: 'Side-by-side definition cards, for a pair of terms worth comparing.'
              fields:
                -
                  handle: anchor
                  field:
                    type: text
                    display: Anchor
                    instructions: 'Optional. Lets other text link to #this.'
                -
                  handle: cards
                  field:
                    type: grid
                    display: Cards
                    mode: stacked
                    add_row: 'Add card'
                    fields:
                      -
                        handle: term
                        field:
                          type: text
                          display: Term
                      -
                        handle: body
                        field:
                          type: textarea
                          display: Body
                          instructions: Markdown.
            callout:
              display: Callout
              icon: alert-warning-exclamation-mark
              instructions: 'A tinted box set apart from the story, e.g. a practical summary for readers who arrive from search.'
              fields:
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                -
                  handle: body
                  field:
                    type: textarea
                    display: Body
                    instructions: Markdown.
            source_quote:
              display: 'Quoted source'
              icon: text-quote
              instructions: 'Someone else''s words, with who said them. For your own line set big for emphasis, use the quote button instead.'
              fields:
                -
                  handle: quote
                  field:
                    type: textarea
                    display: Quote
                    instructions: 'Markdown, so **bold** can mark the part that matters.'
                -
                  handle: source
                  field:
                    type: text
                    display: Source
                    width: 50
                    instructions: 'e.g. "Edmonton Police Commission website".'
                -
                  handle: source_url
                  field:
                    type: text
                    display: 'Source link'
                    width: 50
                    instructions: 'Optional.'
                -
                  handle: speaker
                  field:
                    type: text
                    display: Speaker
                    width: 50
                    instructions: 'Optional. With a photo, the quote becomes a speech bubble from this person, and Source becomes the small print under it.'
                -
                  handle: speaker_role
                  field:
                    type: text
                    display: 'Speaker title'
                    width: 50
                -
                  handle: speaker_photo
                  field:
                    type: assets
                    container: assets
                    max_files: 1
                    display: 'Speaker photo'
                    instructions: 'A square headshot; shown as a small circle.'
                -
                  handle: stamp
                  field:
                    type: text
                    display: Stamp
                    instructions: 'Optional. A rubber stamp slapped on the bubble, e.g. "Approved".'
                -
                  handle: bubble
                  field:
                    type: toggle
                    display: 'Speech bubble without a photo'
                    instructions: 'Show this as a speech bubble even with no speaker photo; their initial stands in for the face.'
                -
                  handle: document
                  field:
                    type: toggle
                    display: Document
                    instructions: 'For legislation, orders and other official text: a sheet of paper in a serif face, slightly askew, with the source (linked) as its heading. Ignored on a speech bubble.'
            motion:
              display: 'Council motion'
              icon: text-quote
              instructions: 'A motion or amendment as a card: its text, who moved and seconded it, and the vote. Copy the wording and roll call from the minutes.'
              fields:
                -
                  handle: kind
                  field:
                    type: button_group
                    display: Kind
                    default: motion
                    options:
                      motion: Motion
                      amendment: Amendment
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                    instructions: 'Markdown. For an amendment, quote the motion it changes and wrap the deleted words in ~~tildes~~ so they show struck through.'
                -
                  handle: mover
                  field:
                    type: entries
                    display: 'Moved by'
                    mode: typeahead
                    max_items: 1
                    width: 50
                    collections:
                      - yegvote_2025_candidates
                -
                  handle: seconder
                  field:
                    type: entries
                    display: 'Seconded by'
                    mode: typeahead
                    max_items: 1
                    width: 50
                    collections:
                      - yegvote_2025_candidates
                -
                  handle: result
                  field:
                    type: button_group
                    display: Result
                    default: none
                    options:
                      none: 'Not shown'
                      carried: Carried
                      defeated: Defeated
                -
                  handle: in_favour
                  field:
                    type: entries
                    display: 'In favour'
                    mode: typeahead
                    width: 50
                    collections:
                      - yegvote_2025_candidates
                    instructions: 'The tally is counted from these two lists.'
                -
                  handle: opposed
                  field:
                    type: entries
                    display: Opposed
                    mode: typeahead
                    width: 50
                    collections:
                      - yegvote_2025_candidates
                -
                  handle: source
                  field:
                    type: text
                    display: Source
                    width: 50
                    instructions: 'e.g. "City Council minutes, January 27, 2026".'
                -
                  handle: source_url
                  field:
                    type: text
                    display: 'Source link'
                    width: 50
            punchline:
              display: Punchline
              icon: text-formatting-bold
              instructions: 'One big closing line, styled like the quote button, with an optional sticker stamped on its corner.'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Line
                -
                  handle: sticker
                  field:
                    type: select
                    display: Sticker
                    clearable: true
                    options:
                      cracked_egg: 'Cracked egg'
            timeline:
              display: Timeline
              icon: time-clock-circle
              instructions: 'Dated entries down a line, ending on one that never arrived.'
              fields:
                -
                  handle: entries
                  field:
                    type: grid
                    display: Entries
                    mode: stacked
                    add_row: 'Add entry'
                    fields:
                      -
                        handle: year
                        field:
                          type: text
                          display: Year
                          width: 25
                      -
                        handle: text
                        field:
                          type: textarea
                          display: Text
                          width: 75
                          instructions: 'Markdown, for links.'
                      -
                        handle: stat
                        field:
                          type: text
                          display: 'Big number'
                          instructions: 'Optional. Set large under the text, e.g. "808,000 → 1.59 million".'
                      -
                        handle: image
                        field:
                          type: assets
                          container: assets
                          max_files: 1
                          display: Image
                -
                  handle: end_year
                  field:
                    type: text
                    display: 'Final year'
                    instructions: 'Optional. The entry that never happened, drawn with a dashed line.'
                -
                  handle: end_text
                  field:
                    type: text
                    display: 'Final text'
                -
                  handle: end_mark
                  field:
                    type: text
                    display: 'Final mark'
                    default: '? ? ?'
                    instructions: 'Separate the characters with spaces; each one is tilted on its own.'
        dessert_people:
          display: 'Dessert People'
          sets:
            verdict:
              display: Verdict
              icon: star
              instructions: 'The two-up rating card. One per recipe; a post baking two recipes gets two, each named.'
              fields:
                -
                  handle: recipe
                  field:
                    type: text
                    display: Recipe
                    instructions: 'Leave empty when the post is about one recipe — the card is then headed "The Verdict".'
                -
                  handle: troy_stars
                  field:
                    type: select
                    display: 'Troy''s stars'
                    width: 33
                    clearable: false
                    options:
                      '0': '0'
                      '0.5': '½'
                      '1': '1'
                      '1.5': '1½'
                      '2': '2'
                      '2.5': '2½'
                      '3': '3'
                      '3.5': '3½'
                      '4': '4'
                      '4.5': '4½'
                      '5': '5'
                -
                  handle: troy_photo
                  field:
                    type: assets
                    container: assets
                    folder: dessert-people
                    max_files: 1
                    display: 'Troy''s face'
                    width: 66
                    instructions: 'The reaction photo beside the rating. Any photo; the shared ones live in the dessert-people folder.'
                -
                  handle: troy_verdict
                  field:
                    type: textarea
                    display: 'Troy''s verdict'
                    instructions: 'Markdown.'
                -
                  handle: rhi_stars
                  field:
                    type: select
                    display: 'Rhianna''s stars'
                    width: 33
                    clearable: false
                    options:
                      '0': '0'
                      '0.5': '½'
                      '1': '1'
                      '1.5': '1½'
                      '2': '2'
                      '2.5': '2½'
                      '3': '3'
                      '3.5': '3½'
                      '4': '4'
                      '4.5': '4½'
                      '5': '5'
                -
                  handle: rhi_photo
                  field:
                    type: assets
                    container: assets
                    folder: dessert-people
                    max_files: 1
                    display: 'Rhianna''s face'
                    width: 66
                -
                  handle: rhi_verdict
                  field:
                    type: textarea
                    display: 'Rhianna''s verdict'
                    instructions: 'Markdown.'
            pro_tip:
              display: 'Pro tip'
              icon: lightbulb
              fields:
                -
                  handle: author
                  field:
                    type: select
                    display: Whose
                    width: 33
                    clearable: false
                    default: troy
                    options:
                      troy: Troy
                      rhianna: Rhianna
                -
                  handle: photo
                  field:
                    type: assets
                    container: assets
                    folder: dessert-people
                    max_files: 1
                    display: Photo
                    width: 66
                -
                  handle: tip
                  field:
                    type: textarea
                    display: Tip
                    instructions: 'Markdown.'
            photo_beside:
              display: 'Photo beside text'
              icon: media-image-picture-orientation
              instructions: 'A photo or short video on one side, a paragraph or two on the other. Stacks on phones.'
              fields:
                -
                  handle: media
                  field:
                    type: assets
                    container: assets
                    dynamic: slug
                    max_files: 1
                    display: 'Photo or video'
                    width: 50
                -
                  handle: side
                  field:
                    type: select
                    display: 'Photo on the'
                    width: 25
                    clearable: false
                    default: left
                    options:
                      left: Left
                      right: Right
                -
                  handle: width
                  field:
                    type: select
                    display: 'Photo width'
                    width: 25
                    clearable: false
                    default: half
                    options:
                      third: 'A third'
                      half: Half
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                    instructions: 'Markdown.'
            gallery:
              display: Gallery
              icon: media-image-picture-gallery
              instructions: 'Photos, gifs or short videos side by side. Optional text sits above them on a card.'
              fields:
                -
                  handle: media
                  field:
                    type: assets
                    container: assets
                    dynamic: slug
                    display: Media
                -
                  handle: layout
                  field:
                    type: select
                    display: Layout
                    width: 33
                    clearable: false
                    default: row
                    options:
                      row: 'One row'
                      grid: 'Two per row'
                      stacked: Stacked
                -
                  handle: size
                  field:
                    type: select
                    display: 'Max width'
                    width: 33
                    clearable: false
                    default: full
                    instructions: 'For a single narrow photo you don''t want stretched.'
                    options:
                      full: Full
                      two_thirds: 'Two thirds'
                      half: Half
                      third: 'A third'
                -
                  handle: card
                  field:
                    type: toggle
                    display: 'On a card'
                    width: 33
                    default: false
                    instructions: 'Grey card behind everything; automatic when there is text.'
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                    instructions: 'Markdown. Shown above the media.'
            pull_quote:
              display: 'Pull quote'
              icon: quote
              instructions: 'One huge line, quotation marks and all.'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Quote
            progress:
              display: 'Progress bar'
              icon: charts-bar
              instructions: 'How far through the book this post gets us.'
              fields:
                -
                  handle: progress
                  field:
                    type: integer
                    display: Done
                    width: 50
                -
                  handle: total
                  field:
                    type: integer
                    display: Of
                    width: 50
                    default: 89
