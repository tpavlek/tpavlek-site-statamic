tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              localizable: true
          -
            handle: year
            field:
              type: integer
              display: Year
              validate:
                - required
          -
            handle: starts_at
            field:
              type: date
              display: 'First day'
              instructions: 'Opening day of the festival. Feeds the Event structured data on every review page for this year, which Google needs before it will show star ratings in search results.'
          -
            handle: ends_at
            field:
              type: date
              display: 'Last day'
              instructions: 'Closing day of the festival.'
          -
            handle: artwork
            field:
              type: assets
              display: Artwork
              container: assets
              folder: fringe
              max_files: 1
          -
            handle: tickets_available
            field:
              type: toggle
              display: 'Tickets Available'
              instructions: 'Show ticket links for this festival year. Turn off once the festival ends and links go dead.'
              default: false
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
title: 'Fringe Festival'
