tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: Description
              instructions: 'Sent to YouTube as the video description, and used as the summary in listings and link previews.'
              listable: false
              localizable: true
          -
            handle: article
            field: long_form.body
            config:
              display: 'Companion article'
              instructions: 'Optional. The written version of the video, for people who would rather read it. Filling this in turns the page into an article with the video beside it, and lists it on /posts and in the feed. The description above stays the YouTube description.'
          -
            handle: video_file
            field:
              type: assets
              display: 'Video File'
              container: video-sources
              max_files: 1
              instructions: 'Upload the source MP4 video file for distribution'
          -
            handle: shortform_content
            field:
              type: textarea
              display: 'Shortform Content'
              instructions: 'Short text for platforms with character limits (e.g. Twitter). Max 280 characters.'
              character_limit: 280
              validate:
                - 'max:280'
          -
            handle: distribution
            field:
              type: video_distribution
              display: Distribution
              instructions: 'Distribute this video to platforms'
          -
            handle: youtube
            field:
              type: text
              display: YouTube
              instructions: 'Enter the YouTube Video ID (not the full URL)'
          -
            handle: tiktok
            field:
              type: text
              display: TikTok
              instructions: 'Enter the TikTok Video ID'
          -
            handle: twitter
            field:
              type: text
              display: Twitter
              instructions: 'The Twitter Tweet ID'
          -
            handle: bluesky
            field:
              type: text
              display: Bluesky
              instructions: 'The Bluesky post URI'
          -
            handle: instagram
            field:
              type: text
              display: Instagram
              instructions: 'Enter the Instagram Reel ID'
          -
            handle: facebook
            field:
              type: text
              display: Facebook
              instructions: 'The Facebook Reel ID (the number at the end of facebook.com/reel/…)'
          -
            handle: thumbnail
            field:
              type: assets
              display: Thumbnail
              container: assets
              folder: videos/covers
              max_files: 1
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: publish_date
            field:
              type: date
              display: 'Publish Date'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: category
            field:
              taxonomies:
                - video_category
              type: terms
              display: category
          -
            handle: topics
            field:
              type: terms
              taxonomies:
                - topics
              display: Topics
              mode: select
              instructions: 'What the /posts topic filter reads (for a video with a companion article), and how a video joins a topic''s hub, e.g. Infill.'
          -
            handle: full_story
            field:
              type: entries
              collections:
                - posts
                - fringe_reviews
              max_items: 1
              mode: select
              display: 'Full story'
              instructions: 'A post or Fringe review that tells this video''s story at length. The video page sends readers there with a "Get the full story" card (a review shows its stars and opening line on it). Usually that means leaving the article empty; when the video adds things the post or review doesn''t, keep the article and the card closes it, in place of a "my full review" line. Not for ones that are only related: list those videos under the post''s Related videos or the review''s companion videos instead.'
          -
            handle: hubs
            field:
              type: entries
              collections:
                - hubs
              mode: select
              display: Hubs
              instructions: 'The hubs this belongs to, e.g. Karen Principe. A piece with a hub''s topic joins it without being tagged here.'
          -
            handle: follows_up
            field:
              type: entries
              collections:
                - videos
              max_items: 1
              mode: select
              display: 'Follow-up to'
              instructions: 'Set on the newer video only. Both pages then show the story so far, the earlier one gets an "update" note, and each article ends with a card for the next part.'
          -
            handle: og_image
            field:
              max_files: 1
              container: assets
              folder: og
              type: assets
              display: 'OpenGraph Image'
              instructions: '1200×630 link-preview image. Leave empty for the site default. The 9:16 thumbnail crops badly in previews, so it isn''t used.'
          -
            handle: newsletter_drafted_at
            field:
              type: text
              display: 'Newsletter drafted'
              visibility: read_only
              instructions: 'Set by "Draft newsletter in Kit". When this was last saved to Kit as a draft broadcast.'
          -
            handle: newsletter_broadcast_id
            field:
              type: text
              display: 'Kit broadcast'
              visibility: read_only
          -
            handle: og_description_override
            field:
              type: textarea
              display: 'OpenGraph Description'
              instructions: 'Leave empty to use the start of the description.'
title: Video
