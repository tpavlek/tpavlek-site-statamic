tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              listable: false
              localizable: true
          -
            handle: video_file
            field:
              type: assets
              display: 'Video File'
              container: video-sources
              max_files: 1
              instructions: 'Upload the source MP4 video file for distribution'
          -
            handle: shortform_content
            field:
              type: textarea
              display: 'Shortform Content'
              instructions: 'Short text for platforms with character limits (e.g. Twitter). Max 280 characters.'
              character_limit: 280
              validate:
                - 'max:280'
          -
            handle: distribution
            field:
              type: video_distribution
              display: Distribution
              instructions: 'Distribute this video to platforms'
          -
            handle: youtube
            field:
              type: text
              display: YouTube
              instructions: 'Enter the YouTube Video ID (not the full URL)'
          -
            handle: tiktok
            field:
              type: text
              display: TikTok
              instructions: 'Enter the TikTok Video ID'
          -
            handle: twitter
            field:
              type: text
              display: Twitter
              instructions: 'The Twitter Tweet ID'
          -
            handle: bluesky
            field:
              type: text
              display: Bluesky
              instructions: 'The Bluesky post URI'
          -
            handle: instagram
            field:
              type: text
              display: Instagram
              instructions: 'Enter the Instagram Reel ID'
          -
            handle: thumbnail
            field:
              type: assets
              display: Thumbnail
              container: assets
              folder: videos/covers
              max_files: 1
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: publish_date
            field:
              type: date
              display: 'Publish Date'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: category
            field:
              taxonomies:
                - video_category
              type: terms
              display: category
title: Video
