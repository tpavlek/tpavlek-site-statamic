tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field: long_form.body
          -
            handle: related_videos
            field:
              collections:
                - videos
              type: entries
              display: 'Related Videos'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: og_title
            field:
              type: text
              display: 'OpenGraph Title'
          -
            handle: og_description
            field:
              type: textarea
              display: 'OpenGraph Description'
          -
            handle: og_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'OpenGraph Image'
          -
            handle: og_background
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Link preview background'
              instructions: 'Optional. A photo behind the generated link preview, in place of the teal doodles. Regenerate the link preview after changing it.'
          -
            handle: topics
            field:
              type: terms
              taxonomies:
                - topics
              display: Topics
              mode: select
              instructions: 'What this post is about. Tagging a post `Edmonton Fringe` is what lists it on the /fringe hub.'
          -
            handle: fringe_festival
            field:
              type: terms
              taxonomies:
                - fringe_festival
              display: 'Fringe Festival'
              mode: select
              instructions: 'Which festival this post is about. Leave empty for a round-up — the year is taken from the shows it headlines. Only set it for a Fringe post that names no shows, or one whose subject year differs from the shows it mentions.'
          -
            handle: newsletter_drafted_at
            field:
              type: text
              display: 'Newsletter drafted'
              visibility: read_only
              instructions: 'Set by "Draft newsletter in Kit". When this was last saved to Kit as a draft broadcast.'
          -
            handle: newsletter_broadcast_id
            field:
              type: text
              display: 'Kit broadcast'
              visibility: read_only
          -
            handle: yegvote_2025_update_types
            field:
              type: terms
              taxonomies:
                - yegvote_2025_update_types
              display: 'YEGVote 2025 Update Types'
              mode: select
title: Post
