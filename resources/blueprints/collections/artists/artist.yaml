tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Name
              required: true
              validate:
                - required
          -
            handle: instagram
            field:
              type: text
              display: Instagram
              instructions: 'Include only the instagram handle'
          -
            handle: website
            field:
              input_type: url
              type: text
              display: Website
              validate:
                - url
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: Artist
