tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Name
              required: true
              validate:
                - required
          -
            handle: instagram
            field:
              type: text
              display: Instagram
              instructions: 'Include only the instagram handle'
          -
            handle: website
            field:
              input_type: url
              type: text
              display: Website
              validate:
                - url
          -
            handle: related_artists
            field:
              type: entries
              display: 'Related artists'
              collections:
                - artists
              instructions: 'Members or collaborations this artist is part of — The Merkin Sisters lists Ingrid Hansen. Read in both directions: set it on either entry and each one''s review pages cross-promote the other''s shows in an "And from …" section.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: Artist
