tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: ticket_import
            field:
              type: ticket_import
              display: 'Populate from ticketing site'
              instructions: 'Paste a tickets.fringetheatre.ca event link to fill in the show details below.'
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: bard
              localizable: true
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - bts_pins
              bts_pins:
                - review_ref
              save_html: false
          -
            handle: stars
            field:
              options:
                -
                  key: 0
                  value: ☆☆☆☆☆
                -
                  key: 1
                  value: ★☆☆☆☆
                -
                  key: 2
                  value: ★★☆☆☆
                -
                  key: 3
                  value: ★★★☆☆
                -
                  key: 4
                  value: ★★★★☆
                -
                  key: 5
                  value: ★★★★★
                -
                  key: '1.5'
                  value: ★½☆☆☆
                -
                  key: '2.5'
                  value: ★★½☆☆
                -
                  key: '3.5'
                  value: ★★★½☆
                -
                  key: '4.5'
                  value: ★★★★½
              type: select
              display: Stars
              clearable: true
          -
            handle: recommendation
            field:
              options:
                -
                  key: recommended
                  value: Recommended
                -
                  key: not-recommended
                  value: 'Not Recommended'
                -
                  key: interested
                  value: Interested
                -
                  key: watchlist
                  value: Watchlist
                -
                  key: pending
                  value: Pending
              max_items: 1
              default: recommended
              type: select
              display: Recommendation
              instructions: "**Pending** means the show was imported from the ticket site and hasn't been looked at — it's the lineup, not an opinion. Pending entries are kept unpublished so they don't get a page of their own; publishing one puts a near-empty page on the site. Pick a real recommendation before publishing."
          -
            handle: ticket_link
            field:
              input_type: url
              type: text
              display: 'Ticket link'
              validate:
                - url
          -
            handle: duration
            field:
              type: integer
              display: 'Duration (minutes)'
              instructions: 'Running time as the ticket site lists it. Filled in by the ticket importer and `fringe:durations`.'
          -
            handle: venue
            field:
              max_items: 1
              collections:
                - venues
              mode: select
              type: entries
              display: Venue
              create: true
              instructions: 'Where the show plays. Filled in by the ticket importer, but venues do occasionally move — check it against the ticketing site if a show relocates. Notes on the venue go on the venue itself and are appended to every review playing there.'
          -
            handle: original_review
            field:
              max_items: 1
              collections:
                - fringe_reviews
              type: entries
              display: 'Original Review'
              instructions: 'For a returning show: the review from the festival where I originally saw it. Leave stars empty to inherit the original rating.'
          -
            handle: artist
            field:
              max_items: 1
              collections:
                - artists
              type: entries
              display: Artist
              create: true
              instructions: 'The artist or company behind this show. Used to cross-link their other work.'
          -
            handle: poster
            field:
              max_files: 1
              container: assets
              folder: fringe
              restrict: true
              type: assets
              display: Poster
  video:
    display: Video
    sections:
      -
        display: 'New Section'
        fields:
          -
            handle: companion_videos
            field:
              collections:
                - videos
              type: entries
              display: 'Companion Videos'
  social:
    display: 'Social Card'
    sections:
      -
        fields:
          -
            handle: share_quote
            field:
              type: textarea
              display: 'Share Quote'
              character_limit: 280
              instructions: 'Pull quote overlaid on the Instagram share card. Line breaks are kept. Best edited in the social card builder.'
          -
            handle: share_image
            field:
              max_files: 1
              container: assets
              folder: fringe/share-cards
              type: assets
              display: 'Share Card Background'
              instructions: 'Optional background that overrides the poster on the share card.'
          -
            handle: share_card_options
            field:
              type: array
              mode: dynamic
              display: 'Share Card Options'
              instructions: 'Positioning settings saved from the social card builder.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: festival
            field:
              max_items: 1
              taxonomies:
                - fringe_festival
              type: terms
              display: Festival
              default: 2026
              instructions: 'Choose the festival this review is for'
              validate:
                - required
          -
            handle: categories
            field:
              taxonomies:
                - fringe_show_categories
              type: terms
              display: Categories
          -
            handle: og_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'OpenGraph Image'
title: 'Fringe Review'
