title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              character_limit: 0
              display: Title
              validate:
                - required
          -
            handle: banner
            field:
              type: assets
              container: assets
              max_files: 1
              display: Banner
              instructions: 'Optional wide image above the title, like the home page banner.'
          -
            handle: content
            field:
              escape_markup: true
              type: markdown
              listable: false
              display: Content
          -
            handle: og_description
            field:
              type: textarea
              display: 'OpenGraph Description'
          -
            handle: og_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'OpenGraph Image'
              instructions: 'Also the banner photo on the one-off pages that open with one.'
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: after_content
            field:
              type: markdown
              listable: false
              display: 'After Content'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
