

<div class="max-w-5xl mx-auto mb-8">
    <div class="bg-[url(/assets/yegvote-2025/endorsement-bg.png)] bg-cover px-5 py-4 flex flex-col md:flex-row md:items-center">
        <div class="h-full pr-8">
            <img src="/assets/yegvote-2025/thumbs-up.png" class="h-[140px]"/>
        </div>
        <div>
            <div>
                <h1 class="text-black bg-yellow-300 px-4 py-2 my-0 inline-block font-black text-4xl">
                    Pavlek's Picks
                </h1>
            </div>

            <h1 class="text-black bg-yellow-300 px-4 py-2 my-0 inline-block font-light text-4xl">
                Edmonton Election 2025
            </h1>
        </div>
    </div>
</div>


<div class="pb-8 max-w-4xl mx-auto text-lg">
    <div class="content">
        {{ content }}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
        {{ collection:endorsements as="endorsement" }}
            {{ endorsement }}
            {{ if content }}
                <a href="{{ url }}">
                    <div class="hover:opacity-90">
                        <img src="{{ sharable_image:url }}" />
                    </div>
                    <div class="text-right text-sm tracking-tight uppercase px-2 py-2 border border-teal rounded-b-md bg-opacity-30 bg-teal">
                        READ MORE
                    </div>
                </a>
            {{ else }}
                <div>
                    <div class="">
                        <img src="{{ sharable_image:url }}" />
                    </div>
                    <div class="text-right text-sm tracking-tight uppercase px-2 py-2 border border-teal rounded-b-md bg-opacity-30 bg-teal">
                        Coming soon
                    </div>

                </div>
            {{ /if }}

            {{ /endorsement }}
        {{ /collection:endorsements }}
    </div>

    <hr class="w-1/2 text-center mx-auto py-4" />

    <h3 class="uppercase font-semibold text-2xl">Videos</h3>

    <ul class="flex gap-4 overflow-x-auto pb-3 -mx-4 px-4 sm:mx-0 sm:px-0 list-none p-0 m-0">
        {{ videos }}
            {{ partial:video-card }}
        {{ /videos }}
    </ul>


</div>
