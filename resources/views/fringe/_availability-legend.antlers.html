{{# The availability colour key, shared by the sold-out page and the review-page card. No
    outer margin — the caller wraps it. #}}
<ul class="list-none p-0 m-0 flex flex-wrap gap-x-5 gap-y-1 text-sm text-gray-600">
    <li class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-green-500"></span> Available</li>
    <li class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-yellow-500"></span> Reduced</li>
    <li class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-orange-500"></span> Low availability</li>
    <li class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-red-600"></span> Sold out</li>
    <li class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-gray-400"></span> Cancelled</li>
    <li class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-gray-300"></span> Completed</li>
</ul>
