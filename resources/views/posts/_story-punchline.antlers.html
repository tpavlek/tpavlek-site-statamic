{{# One big closing line, in the same voice as the quote button's pull quote, with an
    optional sticker stamped on its bottom-right corner. Stickers are drawn inline so
    they stay crisp and need no asset; add one by adding a branch and a select option. #}}
<figure class="story-punchline">
    <blockquote class="story-punchline__text">{{ text }}</blockquote>
    {{ if sticker == 'cracked_egg' }}
        <svg class="story-punchline__sticker" viewBox="0 0 100 110" aria-hidden="true">
            <g fill="#fff" stroke="#1f2937" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
                {{# The bottom half of the shell, jagged where it broke. #}}
                <path d="M14 62 L23 53 L31 63 L40 51 L50 63 L59 52 L68 62 L77 52 L86 61 C88 86 71 104 50 104 C29 104 12 87 14 62 Z" />
                {{# The yolk, just showing over the rim. #}}
                <ellipse cx="50" cy="60" rx="17" ry="7" fill="#fbbf24" />
                {{# The top half, knocked askew. #}}
                <path transform="rotate(-20 50 40) translate(-4 -12)" d="M18 46 C18 20 34 6 50 6 C66 6 82 20 82 46 L73 39 L65 49 L56 38 L47 49 L38 38 L29 48 L22 40 Z" />
            </g>
            {{# Hairline cracks running down from the break. #}}
            <path d="M40 66 L44 74 L41 82 M62 66 L59 75" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" />
        </svg>
    {{ /if }}
</figure>
