{{# Picture tiles that build to one empty, dashed tile: the list is the setup and the
    empty tile is the punchline, so the reader sees the gap before reading it. Two
    across on a phone, all in a row from md up, same as the stat strip. #}}
<figure class="story-scorecard">
    {{ if heading }}<figcaption class="story-scorecard__heading">{{ heading }}</figcaption>{{ /if }}
    <ul class="story-scorecard__tiles list-none">
        {{ tiles }}
            <li class="story-scorecard__tile">
                {{ image }}
                    <img src="{{ url }}" alt="{{ alt | entities }}" class="story-scorecard__image" loading="lazy" />
                {{ /image }}
                <span class="story-scorecard__caption">{{ caption }}</span>
            </li>
        {{ /tiles }}
        {{ if empty_label }}
            <li class="story-scorecard__tile story-scorecard__tile--empty">
                <span class="story-scorecard__value">{{ empty_value ?? '0' }}</span>
                <span class="story-scorecard__caption">{{ empty_label }}</span>
            </li>
        {{ /if }}
    </ul>
    {{ if punchline }}<p class="story-scorecard__punchline">{{ punchline }}</p>{{ /if }}
</figure>
