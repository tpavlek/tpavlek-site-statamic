{{# A row of big numbers: two across on a phone, all in a row from md up. #}}
<dl class="story-stats">
    {{ stats }}
        <div class="story-stats__item">
            <dt class="story-stats__label">{{ label }}</dt>
            <dd class="story-stats__value">{{ value }}</dd>
        </div>
    {{ /stats }}
</dl>
