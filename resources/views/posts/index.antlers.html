<div class="pb-8 max-w-4xl mx-auto text-lg">
    {{ collection:posts as="posts" sort="date:desc" }}
        {{ posts }}
        {{ if yegvote_2025_update_types | pluck('title') | contains_any('Update', 'Analysis', 'Context') }}
            <a href="{{ url }}" class="appearance-none text-gray-800 no-underline">
                <div class="rounded-lg rounded-l-none border border-grey-300 hover:bg-gray-50 mb-3">
                    <div class="border-teal border-l-8">
                        <div class="px-4 py-2">
                            <div class="text-normal font-light flex items-center">{{ partial:yegvote-2025/update-badge }} <span>{{ title }}</span></div>
                            <span class="text-xs text-gray-600 uppercase">{{ date }}</span>

                        </div>
                    </div>
                </div>
            </a>
        {{ /if }}

        {{ /posts }}
    {{ /collection:posts }}
</div>
